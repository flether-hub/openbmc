# CTOPAI OpenBMC distribution: the OpenBMC Phosphor distro with the vendor release
# version.  os-release (VERSION_ID, EXTENDED_VERSION) and the IPMI firmware
# revision of "mc info" take DISTRO_VERSION, which must be numeric major.minor
# (2.0.0 is shown as firmware revision 2.00).
# Select it with DISTRO = "ctopai-openbmc" in conf/local.conf (the layer's
# local.conf.sample and the ./setup script already do).
require conf/distro/openbmc-phosphor.conf

DISTRO_VERSION = "2.0.0"