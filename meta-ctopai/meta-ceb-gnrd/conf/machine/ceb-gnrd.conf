KERNEL_DEVICETREE = "aspeed/aspeed-ast2600-evb.dtb"

UBOOT_MACHINE = "ast2600_openbmc_spl_defconfig"
UBOOT_DEVICETREE = "ast2600-evb"
SPL_BINARY = "spl/u-boot-spl.bin"
# Disable hardware root of trust by default.
# If users want to enable secure boot,
# please do the following steps.
# 1. Set SOCSEC_SIGN_ENABLE to "1".
# 2. Provide platform OTP config.
# There was an example in p10bmc.
# If users enable socsec signing but do not provide OTP config,
# u-boot will be built failed.
SOCSEC_SIGN_ENABLE = "0"

require conf/machine/include/ast2600.inc
require conf/machine/include/obmc-bsp-common.inc

SERIAL_CONSOLES = "115200;ttyS4"

# AST2600 EVB has 64MB SPI flash
FLASH_SIZE = "65536"

# PLDM over MCTP: BIOS setup (menu) attribute access via Redfish/PLDM,
# PLDM sensors and PLDM firmware update.  pldm.inc pulls in mctp.inc too.
include conf/distro/include/pldm.inc

# Managed server: enable host/chassis power, flash and state management
# features (required for host power control during BIOS update, host state
# monitoring, and IPMI host channel).
MACHINE_FEATURES += " \
        obmc-bmc-state-mgmt \
        obmc-host-ctl \
        obmc-host-ipmi \
        obmc-phosphor-fan-mgmt \
        obmc-phosphor-chassis-mgmt \
        obmc-phosphor-flash-mgmt \
        obmc-phosphor-system-mgmt \
        obmc-chassis-state-mgmt \
        obmc-host-state-mgmt \
        "

# dbus-sensors provides the PECI-based Intel CPU/DIMM temperature sensors
# (IntelCPUSensor) via libpeci, in addition to the generic sensor set.
VIRTUAL-RUNTIME_obmc-sensors-hwmon = "dbus-sensors"

# The host IPMI path is the AST2600 KCS bridge.  Keep the KCS device at the
# OpenBMC default until the production board's KCS routing is confirmed.
PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw = "phosphor-ipmi-kcs"
PREFERRED_PROVIDER_virtual/obmc-chassis-mgmt = "packagegroup-ceb-gnrd-apps"
PREFERRED_PROVIDER_virtual/obmc-fan-mgmt = "packagegroup-ceb-gnrd-apps"
PREFERRED_PROVIDER_virtual/obmc-flash-mgmt = "packagegroup-ceb-gnrd-apps"
PREFERRED_PROVIDER_virtual/obmc-system-mgmt = "packagegroup-ceb-gnrd-apps"

# The platform requirement is two hot-pluggable PMBus PSUs.  The value is
# consumed by PSU monitor/link recipes when those hardware mappings are added.
OBMC_POWER_SUPPLY_INSTANCES = "0 1"

MACHINE_FEATURES:append = " peci-hwmon"
MACHINE_EXTRA_RRECOMMENDS:append = " ipmitool"

# Install the board hardware contract while the final schematics and device
# addresses are still being confirmed.  The package is data-only: it does not
# publish fake sensors or start a replacement service.
MACHINE_FEATURES:append = " ceb-gnrd-hardware-contract"
MACHINE_EXTRA_RDEPENDS:append = " ceb-gnrd-hardware-contract"
