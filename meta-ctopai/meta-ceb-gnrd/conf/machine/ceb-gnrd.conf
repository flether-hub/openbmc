KERNEL_DEVICETREE = "aspeed/aspeed-ceb-gnrd.dtb"

UBOOT_MACHINE = "ast2600_openbmc_spl_defconfig"
UBOOT_DEVICETREE = "ast2600-ceb-gnrd"
SPL_BINARY = "spl/u-boot-spl.bin"
# Disable hardware root of trust by default.
# If users want to enable secure boot,
# please do the following steps.
# 1. Set SOCSEC_SIGN_ENABLE to "1".
# 2. Provide platform OTP config.
# There was an example in p10bmc.
# If users enable socsec signing but do not provide OTP config,
# u-boot will be built failed.
SOCSEC_SIGN_ENABLE = "0"

require conf/machine/include/ast2600.inc
require conf/machine/include/obmc-bsp-common.inc

SERIAL_CONSOLES = "115200;ttyS4"

# The board-specific serial-getty@ttyS4 instance waits for multi-user.target
# and the bmc_booted LED job before presenting the debug-console login prompt.

# Keep the critical local BMC debug console on UART5 (ttyS4, 115200 baud;
# TXD5/RXD5 route to the board debug header at AST2600 package balls C8/D8).
# Host SOL defaults to physical UART3, matching the board dump. Web SOL can
# also select VUART1 (host COM1 over eSPI) through a separate console endpoint.
OBMC_CONSOLE_HOST_TTY = "ttyS2"
OBMC_CONSOLE_TTYS = "ttyS2 ttyVUART0"

# CEB-GNRD BMC firmware flash (W25Q512JVFIQ) is 64 MiB on AST2600 Firmware SPI/FMC.
FLASH_SIZE = "65536"

# The default 64 MiB layout gives the read-only rootfs 32 MiB (10 MiB..42 MiB),
# which this image exceeds.  Give it 44 MiB (10 MiB..54 MiB) and keep 10 MiB for
# the read-write overlay.  The "rofs" and "rwfs" partitions in the Linux and
# U-Boot device trees must use the same offsets.
# image_types_phosphor sets this per flash size (FLASH_RWFS_OFFSET:flash-65536),
# and an override wins over a plain assignment, so use the same override here.
FLASH_RWFS_OFFSET:flash-65536 = "55296"

# PLDM over MCTP: BIOS setup (menu) attribute access via Redfish/PLDM,
# PLDM sensors and PLDM firmware update.  pldm.inc pulls in mctp.inc too.
include conf/distro/include/pldm.inc

# Managed server: enable host/chassis power, flash and state management
# features (required for host power control during BIOS update, host state
# monitoring, and IPMI host channel).  obmc-host-ctl is deliberately not listed:
# its only provider is obmc-op-control-host (OpenPOWER host control), x86-power-control
# does the host control here (the Intel reference platform does not enable it either).
# A feature is only active when both the distro and the machine list it.
MACHINE_FEATURES += " \
        obmc-bmc-state-mgmt \
        obmc-host-ipmi \
        obmc-phosphor-fan-mgmt \
        obmc-phosphor-chassis-mgmt \
        obmc-phosphor-flash-mgmt \
        obmc-phosphor-system-mgmt \
        obmc-chassis-state-mgmt \
        obmc-host-state-mgmt \
        "

# PECI0 (AT29 / BMC_CPU_PECI) gives the Xeon 6 CPU and DIMM temperatures through
# the kernel peci_cputemp / peci_dimmtemp hwmon drivers, read by
# ceb-gnrd-temp-max. DIMM I3C is not used for temperatures.
VIRTUAL-RUNTIME_obmc-sensors-hwmon = "dbus-sensors"

# The host IPMI path is the AST2600 KCS bridge.  Keep the KCS device at the
# OpenBMC default until the production board's KCS routing is confirmed.
PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw = "phosphor-ipmi-kcs"
PREFERRED_PROVIDER_virtual/obmc-chassis-mgmt = "packagegroup-ceb-gnrd-apps"
VIRTUAL-RUNTIME_obmc-chassis-state-manager:ceb-gnrd = "x86-power-control"
VIRTUAL-RUNTIME_obmc-host-state-manager:ceb-gnrd = "x86-power-control"
# x86-power-control also applies the power restore policy when the BMC boots; the
# default phosphor-state-manager-discover service must not run next to it
# (same setting as the Intel reference platform).
VIRTUAL-RUNTIME_obmc-discover-system-state:ceb-gnrd = "x86-power-control"
VIRTUAL-RUNTIME_obmc-fan-presence:ceb-gnrd = ""
# Fans are driven by phosphor-pid-control using the Pid/Pid.Zone/Stepwise entries
# in the Entity-Manager configuration (phosphor-fan-control needs YAML we do not ship).
VIRTUAL-RUNTIME_obmc-fan-control = "phosphor-pid-control"
PREFERRED_PROVIDER_virtual/obmc-fan-mgmt = "packagegroup-ceb-gnrd-apps"
PREFERRED_PROVIDER_virtual/obmc-flash-mgmt = "packagegroup-ceb-gnrd-apps"
PREFERRED_PROVIDER_virtual/obmc-system-mgmt = "packagegroup-ceb-gnrd-apps"
PREFERRED_PROVIDER_virtual/phosphor-led-manager-config-native = "ceb-gnrd-led-manager-config-native"
# Single-socket board: replace the generic multi-CPU/DIMM static sensor list.
PREFERRED_PROVIDER_virtual/phosphor-ipmi-sensor-inventory = "ceb-gnrd-ipmi-sensor-inventory-native"
# ipmitool fru print reads FRU 0 back from the inventory with the board's FRU
# mapping (the meta-phosphor default is an example for another system).
PREFERRED_PROVIDER_virtual/phosphor-ipmi-fru-read-inventory = "ceb-gnrd-ipmi-fru-read-inventory-native"

# The platform supports up to two hot-pluggable PMBus PSUs; depending on the
# chassis, 0, 1 or 2 modules are present at 0x58/0x59/0x5a.  The value is
# consumed by PSU monitor/link recipes when those hardware mappings are added.
OBMC_POWER_SUPPLY_INSTANCES = "0 1"

MACHINE_FEATURES:append = " peci-hwmon"
MACHINE_FEATURES:append = " i3c adc pmbus"
MACHINE_EXTRA_RRECOMMENDS:append = " ipmitool i2c-tools"
MACHINE_EXTRA_RDEPENDS:append = " ceb-gnrd-ipmi-i2c net-tools ipmitool"

# SSH is served by dropbear (ssh-server-dropbear in the image).  scp needs the
# sftp server (new scp protocol, already pulled in by dropbear) and the scp
# program itself for clients that still use the legacy protocol (scp -O).
MACHINE_EXTRA_RDEPENDS:append = " openssh-scp openssh-sftp-server"

# curl on the BMC for debugging Redfish and network access from the console.
MACHINE_EXTRA_RDEPENDS:append = " curl"

# Add the Admin-only IPMI Master Write-Read command to this machine's command
# whitelist; the per-I2C allowlist remains restricted to PCIe buses 0..5.
VIRTUAL-RUNTIME_phosphor-ipmi-providers:append = " ceb-gnrd-ipmi"

# Install the board hardware contract (data only: it does not publish fake
# sensors or start a service) while the final schematics and device addresses are
# still being confirmed.
MACHINE_EXTRA_RDEPENDS:append = " \
        ceb-gnrd-hardware-contract \
        "
