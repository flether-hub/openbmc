# Boot order: first try to load a FIT image from the TFTP server 192.168.185.84,
# and if that fails (no link, no server, no file, or the image does not boot)
# fall through to the image in the local SPI flash ("run bootspi", the default).
#
# The IP settings match the BMC's static address in Linux.  TFTP timeouts are
# shortened so a missing server only delays the boot by a few seconds.
CONFIG_BOOTCOMMAND="setenv ipaddr 192.168.185.200; setenv netmask 255.255.255.0; setenv gatewayip 192.168.185.1; setenv serverip 192.168.185.84; setenv tftptimeout 2000; setenv tftptimeoutcountmax 2; if tftpboot 0x83000000 fitImage; then bootm 0x83000000; fi; run bootspi"
