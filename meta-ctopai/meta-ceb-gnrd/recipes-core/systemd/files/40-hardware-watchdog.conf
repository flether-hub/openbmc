[Manager]
# Replaces meta-phosphor's drop-in of the same name (a file in /etc overrides the
# file of the same name in /usr/lib).  Only the hardware reset is kept: aspeed_wdt
# has no pre-timeout, so RuntimeWatchdogPreSec / RuntimeWatchdogPreGovernor=panic
# are left out (they only made systemd log "Failed to set watchdog
# pretimeout_governor" at every boot).
RuntimeWatchdogSec=120s
WatchdogDevice=/dev/watchdog