[Manager]
# meta-phosphor's 40-hardware-watchdog.conf asks for a 30 s pre-timeout with the
# panic governor.  aspeed_wdt has no pre-timeout, so the kernel hides
# pretimeout_governor in sysfs and systemd logs a failure at every boot.  Clear both
# settings; RuntimeWatchdogSec=120s (the real hardware reset) is not touched.
RuntimeWatchdogPreSec=
RuntimeWatchdogPreGovernor=
