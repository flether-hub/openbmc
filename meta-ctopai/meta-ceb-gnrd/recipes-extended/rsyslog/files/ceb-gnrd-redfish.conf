# Redfish event log: bmcweb reads /var/log/redfish, one line per journal entry that
# has a REDFISH_MESSAGE_ID, in the format "<timestamp> <MessageId>,<MessageArgs>"
# (the IPMI SEL, /var/log/ipmi_sel, is separate and only seen by IPMI).  Same rule
# as the Intel reference platform.  Requires imjournal.
template(name="CebGnrdRedfishTemplate" type="list") {
    property(name="timereported" dateFormat="rfc3339")
    constant(value=" ")
    property(name="$!REDFISH_MESSAGE_ID")
    constant(value=",")
    property(name="$!REDFISH_MESSAGE_ARGS")
    constant(value="\n")
}

if ($!REDFISH_MESSAGE_ID != "") then {
    action(type="omfile" file="/var/log/redfish" template="CebGnrdRedfishTemplate"
           rotation.sizeLimit="65536"
           rotation.sizeLimitCommand="/usr/libexec/ceb-gnrd-rotate-log"
           rotation.sizeLimitCommandPassFileName="on")
}
