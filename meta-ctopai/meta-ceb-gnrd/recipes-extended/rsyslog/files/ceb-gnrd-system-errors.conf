# Preserve warning and higher severity messages across boots on JFFS2 rwfs.
# The existing imjournal input supplies records from the RAM journal.
# Continue processing so SEL, Redfish and remote logging still receive records.
if ($syslogseverity <= 4) then {
    action(type="omfile" file="/var/log/bmc-system.log"
           template="RSYSLOG_FileFormat"
           rotation.sizeLimit="524288"
           rotation.sizeLimitCommand="/usr/libexec/ceb-gnrd-rotate-log"
           rotation.sizeLimitCommandPassFileName="on")
}
