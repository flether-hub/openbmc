[Service]
# bmcweb clears the Redfish event log ("Delete all" on the web Event logs page) by
# removing /var/log/redfish* and asking systemd to ReloadUnit rsyslog.service.  The
# rsyslog unit has no ExecReload, so systemd refuses ("Job type reload is not
# applicable") and bmcweb answers with an Internal Error.  Same drop-in as the
# Intel reference platform.
ExecReload=/bin/kill -HUP $MAINPID