# eSPI (Enhanced Serial Peripheral Interface) support.
# The AST2600 eSPI slave connects to the Intel Xeon host's eSPI master,
# replacing the legacy LPC bus on Intel platforms.
CONFIG_ASPEED_ESPI=y

# LPC snoop driver: snoops BIOS POST codes written to I/O port 0x80.
# Used by phosphor-host-postd / phosphor-post-code-manager to track
# BIOS boot progress.
CONFIG_ASPEED_LPC_SNOOP=y

# PECI (Platform Environment Control Interface) for Intel Xeon CPU and
# DIMM temperature monitoring, used by dbus-sensors IntelCPUSensor and
# the hwmon peci-hwmon (peci-hwmon) packages.
CONFIG_PECI=y
CONFIG_PECI_CPU=y
CONFIG_PECI_ASPEED=y
CONFIG_SENSORS_PECI_CPUTEMP=y
CONFIG_SENSORS_PECI_DIMMTEMP=y

# I2C and HWMON framework for sensor exposure and FRU EEPROM access.
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_MUX=y
CONFIG_I2C_MUX_PCA954x=y
CONFIG_EEPROM_AT24=y
CONFIG_HWMON=y
CONFIG_SENSORS_LM75=y

# Board-side telemetry controllers.  The device-tree nodes and channel
# scaling are board-specific; enabling the drivers here keeps the kernel ready
# for the mappings in the CEB-GNRD hardware contract.
CONFIG_IIO=y
CONFIG_ASPEED_ADC=y
CONFIG_IIO_HWMON=y
CONFIG_PMBUS=y
CONFIG_SENSORS_PMBUS=y

# AST2600 I3C masters for DDR SPD/temperature devices and CPU management.
CONFIG_I3C=y
CONFIG_DW_I3C_MASTER=y
CONFIG_AST2600_I3C_MASTER=y

# Six board fan channels use the AST2600 G6 PWM/TACH block.
CONFIG_PWM=y
CONFIG_SENSORS_ASPEED_G6=y
