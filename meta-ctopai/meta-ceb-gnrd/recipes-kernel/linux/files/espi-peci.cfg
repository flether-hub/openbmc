# AST2600 eSPI Peripheral I/O and Virtual Wire channels. The board-local kernel
# patch adds this actual Kconfig symbol and sets Peripheral and Virtual Wire
# Ready; OOB/Flash remain unused. I/O port cycles (including Super I/O config
# ports) are handled by the AST2600 peripheral/SIO hardware path.
CONFIG_ASPEED_ESPI=y

# Match the IBM system1 host IPMI stack. The KCS BMC core is already selected
# by the AST2600 defconfig; keep its userspace raw cdev enabled for kcsbridge.
CONFIG_ASPEED_KCS_IPMI_BMC=y
CONFIG_IPMI_KCS_BMC_CDEV_IPMI=y
CONFIG_IPMI_KCS_BMC_CDEV_RAW=y

# LPC snoop driver: snoops BIOS POST codes written to I/O port 0x80.
# Used by phosphor-host-postd / phosphor-post-code-manager to track
# BIOS boot progress.
CONFIG_ASPEED_LPC_SNOOP=y

# /dev/mem for debugging (busybox devmem on SoC registers, e.g. SCU, eSPI, VUART).
# STRICT_DEVMEM stays at its default, so RAM is still protected and only device
# registers can be read and written.  It lets root read and write any hardware
# register: remove it from production images.
# The meta-aspeed defconfig sets CONFIG_DEVMEM_BOOTPARAM=y, which does not create
# the /dev/mem node unless the kernel command line has mem.devmem=1; turning that
# option off makes the node always appear.
CONFIG_DEVMEM=y
# CONFIG_DEVMEM_BOOTPARAM is not set

# AST2600 VUART1: host COM1 over eSPI, the SOL source (obmc-console on ttyVUART0).
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_ASPEED_VUART=y

# PECI (Platform Environment Control Interface) on AST2600 PECI0 to the Xeon
# 6 CPU. CPU and DIMM thermals come from PECI; DIMM I3C is not used for temps.
CONFIG_PECI=y
CONFIG_PECI_CPU=y
CONFIG_PECI_ASPEED=y
CONFIG_SENSORS_PECI_CPUTEMP=y
CONFIG_SENSORS_PECI_DIMMTEMP=y

# I2C and HWMON framework for sensor exposure and FRU EEPROM access.
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_MUX=y
CONFIG_I2C_MUX_PCA954x=y
CONFIG_EEPROM_AT24=y
CONFIG_HWMON=y
CONFIG_SENSORS_LM75=y

# AST2600 dedicated CHASI# chassis intrusion latch, exposed as intrusion0_alarm.
CONFIG_SENSORS_ASPEED_CHASSIS=y

# AST2600 WDT1 backs systemd's RuntimeWatchdogSec. A systemd/kernel hang
# stops refreshes and lets the watchdog reset the BMC SoC.
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_NOWAYOUT=y
CONFIG_WATCHDOG_SYSFS=y
CONFIG_ASPEED_WATCHDOG=y
# A kernel crash must restart the BMC quickly instead of waiting for the
# watchdog: an oops becomes a panic, and a panic restarts the SoC after 5 s
# through the aspeed_wdt restart handler.  (Without these a panicked kernel
# stays hung until the 120 s systemd runtime watchdog expires.)
CONFIG_PANIC_ON_OOPS=y
CONFIG_PANIC_TIMEOUT=5

# echo c > /proc/sysrq-trigger crashes the kernel on purpose, to test the
# panic -> automatic restart path.  All SysRq functions are allowed for root
# (CONFIG_MAGIC_SYSRQ_DEFAULT_ENABLE=0x1); a serial BREAK must not trigger them.
CONFIG_MAGIC_SYSRQ=y
CONFIG_MAGIC_SYSRQ_DEFAULT_ENABLE=0x1
# CONFIG_MAGIC_SYSRQ_SERIAL is not set

# GPIOP7 heartbeat trigger is enabled only after host POST traffic is observed.
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_GPIO=y
CONFIG_LEDS_TRIGGERS=y
CONFIG_LEDS_TRIGGER_HEARTBEAT=y

# NCT3015Y-R board RTC on schematic I2C10 / Linux i2c9. Use the battery-
# backed RTC to seed BMC CLOCK_REALTIME at boot and keep it updated after NTP.
CONFIG_RTC_CLASS=y
CONFIG_RTC_HCTOSYS=y
CONFIG_RTC_HCTOSYS_DEVICE="rtc0"
CONFIG_RTC_SYSTOHC=y
CONFIG_RTC_SYSTOHC_DEVICE="rtc0"
CONFIG_RTC_DRV_NCT3018Y=y

# BIOS MX25U51245G is 64 MiB on SPI1; BMC W25Q512JV is on Firmware SPI/FMC.
CONFIG_SPI=y
CONFIG_SPI_ASPEED=y
CONFIG_MTD=y
CONFIG_MTD_SPI_NOR=y

# Board-side telemetry controllers.  The device-tree nodes and channel
# scaling are board-specific; enabling the drivers here keeps the kernel ready
# for the mappings in the CEB-GNRD hardware contract.
CONFIG_IIO=y
CONFIG_ASPEED_ADC=y
CONFIG_IIO_HWMON=y
CONFIG_PMBUS=y
CONFIG_SENSORS_PMBUS=y
CONFIG_SENSORS_MEGCRPS800=y

# Only AST2600 I3C3 is enabled in the board DTS for CPU management.
# DIMM temperatures come from PECI; BMC I3C1/2 and I3C4 are not enabled.
CONFIG_I3C=y
CONFIG_DW_I3C_MASTER=y
CONFIG_AST2600_I3C_MASTER=y

# Six board fan channels use the AST2600 G6 PWM/TACH block.
CONFIG_PWM=y
CONFIG_SENSORS_ASPEED_G6=y
# pwm-fan0..5 give fansensor and phosphor-pid-control a hwmon pwm1 per fan.
CONFIG_SENSORS_PWM_FAN=y

# Board external network interfaces: RTL8211FS PHY and Intel NC-SI.
CONFIG_REALTEK_PHY=y
CONFIG_NET_NCSI=y
