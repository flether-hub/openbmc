# eSPI (Enhanced Serial Peripheral Interface) Support
CONFIG_ASPEED_LPC_ESPI=y

# PECI (Platform Environment Control Interface) Support for Intel CPUs
CONFIG_PECI=y
CONFIG_PECI_CONTROLLER=y
CONFIG_PECI_ASPEED=y
CONFIG_PECI_CPU=y
CONFIG_PECI_CPUTEMP=y
CONFIG_PECI_DIMMTEMP=y

# HWMON framework for sensor exposure
CONFIG_HWMON=y

# Additional I2C and sensor support for Intel platform
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
