# Extra D-Bus properties for the FRU inventory objects (beyond the FRU fields of
# ceb-gnrd-ipmi-fru.yaml); none needed.
#
# "ipmitool fru" does not use this inventory: with ipmid's dynamic-sensors
# option its FRU commands read and write the FRU EEPROM through fru-device
# (see ceb-gnrd-fru).  This mapping fills the inventory used by the web
# inventory page, from obmc-read-eeprom at boot.
#
# Keep the placeholder as an empty YAML mapping.  The phosphor-ipmi-fru
# generator iterates the document and does not accept YAML null (comments
# only), which would make the compile-time generated C++ fail.
{}
