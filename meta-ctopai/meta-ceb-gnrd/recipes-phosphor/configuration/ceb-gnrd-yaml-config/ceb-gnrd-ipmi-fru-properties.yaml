# Extra inventory properties that phosphor-ipmi-fru sends together with the FRU
# fields (see ceb-gnrd-ipmi-fru.yaml).
#
# ipmid answers Get FRU Inventory Area Info / "ipmitool fru print" only for a FRU
# whose first inventory object (FRU 0: /system) has xyz.openbmc_project.Inventory.
# Item Present = true; otherwise it reports "Device not present".  The FRU parser
# does not set Present by itself, and this EEPROM FRU has no presence detect, so
# it is marked present here whenever its data was read or written.
#
# Boolean values are quoted strings, as in the upstream example.
/system:
    xyz.openbmc_project.Inventory.Item:
        Present: "true"

/system/chassis:
    xyz.openbmc_project.Inventory.Item:
        Present: "true"

/system/chassis/motherboard:
    xyz.openbmc_project.Inventory.Item:
        Present: "true"
