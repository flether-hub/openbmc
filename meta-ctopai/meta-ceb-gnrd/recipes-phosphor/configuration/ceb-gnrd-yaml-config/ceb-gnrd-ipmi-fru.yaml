# IPMI FRU read mapping for ceb-gnrd.
# Maps FRU EEPROM sections to D-Bus inventory paths.
# FRUID 0 = motherboard FRU EEPROM.
#
# entityID/entityInstance use the generic value 0 (unspecified entity).
0:
    /system/chassis/motherboard:
        entityID: 0
        entityInstance: 0
        interfaces:
            xyz.openbmc_project.Inventory.Item.Board.Motherboard:
                Manufacturer:
                    IPMIFruProperty: Manufacturer
                    IPMIFruSection: Board
                Model:
                    IPMIFruProperty: Product Name
                    IPMIFruSection: Product
                PartNumber:
                    IPMIFruProperty: Part Number
                    IPMIFruSection: Board
                SerialNumber:
                    IPMIFruProperty: Serial Number
                    IPMIFruSection: Board
                Version:
                    IPMIFruProperty: Version
                    IPMIFruSection: Product
            xyz.openbmc_project.Inventory.Decorator.Asset:
                BuildDate:
                    IPMIFruProperty: Mfg Date
                    IPMIFruSection: Board
                Manufacturer:
                    IPMIFruProperty: Manufacturer
                    IPMIFruSection: Board
                Model:
                    IPMIFruProperty: Product Name
                    IPMIFruSection: Product
                PartNumber:
                    IPMIFruProperty: Part Number
                    IPMIFruSection: Board
                SerialNumber:
                    IPMIFruProperty: Serial Number
                    IPMIFruSection: Board
                SKU:
                    IPMIFruProperty: SKU
                    IPMIFruSection: Product
                Version:
                    IPMIFruProperty: Version
                    IPMIFruSection: Product
