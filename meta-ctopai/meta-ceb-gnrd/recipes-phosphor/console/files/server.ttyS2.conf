# Host CPU serial console: AST2600 UART3 (ttyS2), a physical UART, not a VUART.
# Receive-only: the host output is wired to UART3 RX and TXD3 is not muxed, so
# input typed in SOL / SSH console never reaches the host.
# console-id is left unset on purpose so the socket keeps the default name that
# bmcweb (web SOL) and phosphor-net-ipmid (IPMI SOL) connect to.
baud = 115200
