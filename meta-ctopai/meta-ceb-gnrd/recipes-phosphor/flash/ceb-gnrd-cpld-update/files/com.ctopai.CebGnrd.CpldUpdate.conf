<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny send_destination="com.ctopai.CebGnrd.CpldUpdate"/>
    <allow send_destination="com.ctopai.CebGnrd.CpldUpdate" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="com.ctopai.CebGnrd.CpldUpdate" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
  <policy user="root">
    <allow own="com.ctopai.CebGnrd.CpldUpdate"/>
    <allow send_destination="com.ctopai.CebGnrd.CpldUpdate"/>
  </policy>
</busconfig>
