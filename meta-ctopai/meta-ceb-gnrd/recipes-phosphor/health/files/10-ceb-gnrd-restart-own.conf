[Unit]
# For this layer's own services (fan settings, temperature maximum, alert LED,
# boot progress):
# systemd brings a crashed or watchdog-killed service back.  No OnFailure= here:
# systemd triggers OnFailure= at every failure, also one that is followed by an
# automatic restart (seen on the VM: one SIGKILL of ceb-gnrd-temp-max sent the BMC
# into Quiesced and rebooted it), and these services are not worth a BMC reboot.
# If one cannot be kept running (5 starts within 5 minutes) it stays failed, which
# ceb-gnrd-check and "systemctl --failed" report.
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=always
