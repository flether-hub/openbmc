[Unit]
# Critical upstream services (ObjectMapper, EntityManager, bmcweb, ipmid), the
# standard OpenBMC "fail fast" recovery:
#  * every failure of the unit triggers OnFailure=, which puts the BMC into the
#    Quiesced state through phosphor-state-manager (the BMC reboots automatically
#    when its auto-reboot-on-bmc-quiesce option is enabled, see
#    phosphor-state-manager_%.bbappend; ceb-gnrd-quiesce-reboot-limit.sh allows
#    only one such reboot in a row);
#  * Restart=always still restarts the service, but systemd runs OnFailure= at
#    every failure, not only when the start limit is hit (verified on the VM), so
#    the restart does not prevent the BMC reboot.
StartLimitIntervalSec=300
StartLimitBurst=5
OnFailure=obmc-bmc-service-quiesce@0.target

[Service]
Restart=always
