[Unit]
# Standard OpenBMC / systemd recovery of a BMC service:
#  * Restart=always brings a crashed (or watchdog-killed) service back;
#  * if it cannot be kept running (5 starts within 5 minutes) the unit is marked
#    failed and OnFailure= puts the BMC into the Quiesced state through
#    phosphor-state-manager (the BMC reboots automatically when its
#    auto-reboot-on-bmc-quiesce option is enabled, see phosphor-state-manager_%.bbappend).
StartLimitIntervalSec=300
StartLimitBurst=5
OnFailure=obmc-bmc-service-quiesce@0.target

[Service]
Restart=always
