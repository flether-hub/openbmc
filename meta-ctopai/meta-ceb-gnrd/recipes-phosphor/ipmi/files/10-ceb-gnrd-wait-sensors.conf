[Service]
# ipmid builds its dynamic sensor list from the object mapper.  Started before
# Entity-Manager and dbus-sensors had published anything, it only showed the two
# static sensors until it was restarted.  Wait (at most 60 s) for the first
# Sensor.Value object; the wait ends silently when none ever appears.
ExecStartPre=-/bin/sh -c 'i=0; while [ "$i" -lt 60 ]; do busctl --system call xyz.openbmc_project.ObjectMapper /xyz/openbmc_project/object_mapper xyz.openbmc_project.ObjectMapper GetSubTreePaths sias /xyz/openbmc_project/sensors 0 1 xyz.openbmc_project.Sensor.Value | grep -q "/xyz/openbmc_project/sensors/" && exit 0; i=$((i+1)); sleep 1; done; exit 0'
TimeoutStartSec=120