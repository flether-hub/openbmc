[Service]
# ipmid builds its dynamic sensor list from the object mapper.  Started while
# Entity-Manager and dbus-sensors are still publishing sensors (their threshold
# interfaces appear a little after the sensor itself) it fails to read them and
# only offers the two static sensors for the first minute.  Wait until the number
# of Sensor.Value objects has stayed the same for 8 s (at most 90 s in total);
# the wait ends silently when none ever appears.
ExecStartPre=-/bin/sh -c 'i=0; last=-1; same=0; while [ "$i" -lt 90 ]; do n=$(busctl --system call xyz.openbmc_project.ObjectMapper /xyz/openbmc_project/object_mapper xyz.openbmc_project.ObjectMapper GetSubTreePaths sias /xyz/openbmc_project/sensors 0 1 xyz.openbmc_project.Sensor.Value | cut -d" " -f2); if [ -n "$n" ] && [ "$n" != 0 ] && [ "$n" = "$last" ]; then same=$((same+1)); else same=0; fi; last=$n; [ "$same" -ge 8 ] && exit 0; i=$((i+1)); sleep 1; done; exit 0'
TimeoutStartSec=120