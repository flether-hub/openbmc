# Factory time mode is Manual: seed system UTC from rtc0 at boot. Persisted
# user selections (including NTP) remain authoritative after firmware updates.
/xyz/openbmc_project/time/sync_method:
    - Interface: xyz.openbmc_project.Time.Synchronization
      Properties:
          TimeSyncMethod:
              Default: Synchronization::Method::Manual

/xyz/openbmc_project/ipmi/sol/eth0:
    - Interface: xyz.openbmc_project.Ipmi.SOL
      Properties:
          Enable:
              Default: 'true'

# Factory default of the power restore policy: AlwaysOn, the host powers on when
# AC power returns (the upstream default is AlwaysOff).  The user can change it in
# the web UI; a saved value is kept until a factory reset.  The whole list of the
# object is replaced by the merge, so PowerRestoreDelay is repeated.
/xyz/openbmc_project/control/host0/power_restore_policy:
    - Interface: xyz.openbmc_project.Control.Power.RestorePolicy
      Properties:
          PowerRestorePolicy:
              Default: RestorePolicy::Policy::AlwaysOn
          PowerRestoreDelay:
              Default: 0

# Host-reported metadata used by IPMI Set/Get ACPI Power State. These fields
# report ACPI status; writing them must not switch chassis power.
/xyz/openbmc_project/control/host0/acpi_power_state:
    - Interface: xyz.openbmc_project.Control.Power.ACPIPowerState
      Properties:
          SysACPIStatus:
              Default: ACPIPowerState::ACPI::Unknown
          DevACPIStatus:
              Default: ACPIPowerState::ACPI::Unknown

# The host may populate this UUID. IPMI uses a stable, distinct board fallback
# until a nonzero host UUID is supplied; do not ship one UUID shared by boards.
/xyz/openbmc_project/Common/UUID:
    - Interface: xyz.openbmc_project.Common.UUID
      Properties:
          UUID:
              Default: '""'
